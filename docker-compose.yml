services:
  db:
    image: mysql:8.0
    container_name: iba_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydb}
      MYSQL_USER: ${MYSQL_USER:-iba_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-iba_password}
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - iba_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iba_nextjs
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Prisma - pointe vers le service `db` (pas localhost)
      DATABASE_URL: mysql://${MYSQL_USER:-iba_user}:${MYSQL_PASSWORD:-iba_password}@db:3306/${MYSQL_DATABASE:-mydb}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-iwJmz2q/1vyCB4ewyVQw5DWSkzB3DnFeW6pk5TCmDx0=}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Mettre à "true" pour exécuter prisma db seed au démarrage
      SEED_ON_START: ${SEED_ON_START:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - iba_network
    # healthcheck optionnel (utilise le même endpoint que le Dockerfile)
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # Optionnel: phpMyAdmin pour administrer MySQL (http://localhost:8080)
  # Décommente le service si besoin
  # phpmyadmin:
  #   image: phpmyadmin/phpmyadmin:5-apache
  #   container_name: iba_phpmyadmin
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #   environment:
  #     PMA_HOST: db
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - iba_network

volumes:
  mysql_data:
    driver: local

networks:
  iba_network:
    driver: bridge
